<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akademia Bystrzaka – Zegar, Matematyka, Ortografia i Flaga/Logo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hand-transition {
      transition: transform 0.5s cubic-bezier(0.4, 2.08, 0.55, 0.44);
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }
    /* Zapobieganie przyklejaniu się obrysów focus/hover na urządzeniach mobilnych */
    .option-btn {
      -webkit-tap-highlight-color: transparent;
      outline: none !important;
    }
    @media (hover: hover) {
      .option-btn:hover {
        border-color: #6366f1;
        background-color: #eef2ff;
      }
    }
    .option-btn:focus-visible {
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans text-slate-800">

  <div class="bg-white rounded-3xl shadow-xl max-w-5xl w-full p-5 sm:p-8 md:p-10">
    
    <!-- Górny pasek: Wybór modułu (Zegar / Matematyka / ...) + Wspólne akcje -->
    <header class="flex flex-wrap items-center justify-between gap-3 pb-5 mb-6 border-b border-slate-100">
      <!-- Przełącznik przedmiotów -->
      <nav id="module-tabs" aria-label="Wybór działu" class="flex flex-wrap items-center gap-2"></nav>

      <!-- Wspólny pasek stanu i narzędzi -->
      <div class="flex flex-wrap items-center gap-2">
        <span id="score-badge" class="bg-indigo-100 text-indigo-700 font-bold px-4 py-1.5 rounded-full text-sm">
          🔥 Wynik: 0
        </span>
        <button id="header-finish-btn" type="button" class="hidden sm:inline-flex bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-xl text-sm transition border border-slate-200" title="Zakończ quiz i zapisz wynik">
          🌙 Koniec
        </button>
        <button id="ranking-btn" type="button" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-semibold px-3 py-1.5 rounded-xl text-sm transition border border-amber-300">
          🏆 Ranking
        </button>
        <button id="lang-btn" type="button" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-3 py-1.5 rounded-xl text-sm transition">
          🌐 PL
        </button>
        <button id="toggle-panel-btn" type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-xl text-sm transition border border-slate-200">
          ⚙️ Opcje
        </button>
      </div>
    </header>

    <!-- Główna siatka 2-kolumnowa -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-center">
      
      <!-- Lewa kolumna: Uniwersalna Scena Zadania (Zegar SVG / Zadanie matematyczne / ...) -->
      <div id="stage-container" class="lg:col-span-6 flex flex-col items-center justify-center"></div>

      <!-- Prawa kolumna: Panel konfiguracji (⚙️) oraz 4 warianty odpowiedzi -->
      <div class="lg:col-span-6 flex flex-col gap-5">
        
        <!-- Dynamiczny panel opcji rodzica/nauczyciela (domyślnie ukryty) -->
        <div id="teacher-panel" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-4 flex-col gap-4"></div>

        <!-- Sekcja pytań i 4 odpowiedzi jednokrotnego wyboru -->
        <div>
          <h3 id="question-title" class="text-lg font-bold text-slate-800 mb-3 text-center lg:text-left">
            Która godzina jest na zegarze?
          </h3>
          <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
          <div id="feedback-box" class="mt-4 min-h-[2.5rem] flex items-center justify-center lg:justify-start font-bold text-sm"></div>

          <!-- Pasek zakończenia quizu / Idziemy spać (w prawym dolnym rogu panelu odpowiedzi) -->
          <div class="mt-2 pt-3 border-t border-slate-100 flex items-center justify-between gap-3">
            <span class="text-xs text-slate-400 font-medium hidden sm:inline-flex items-center gap-1.5">
              <span>🛌</span>
              <span id="finish-quiz-tip">Zmęczony? Możesz zapisać wynik i odpocząć!</span>
            </span>
            <button
              id="finish-quiz-btn"
              type="button"
              class="w-full sm:w-auto ml-auto inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-2xl font-semibold text-sm bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-200 transition cursor-pointer"
            >
              <span>🌙</span>
              <span id="finish-quiz-label">Koniec na dziś</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal Rankingu Top 10 -->
  <div id="ranking-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 sm:p-8 max-h-[90vh] flex flex-col border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h2 id="ranking-modal-title" class="text-xl sm:text-2xl font-extrabold text-slate-800 flex items-center gap-2">
          🏆 Ranking Top 10
        </h2>
        <button id="ranking-close-x" type="button" aria-label="Close" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center transition">
          ✕
        </button>
      </div>

      <!-- Formularz wpisania imienia (widoczny tylko po zakwalifikowaniu do Top 10) -->
      <div id="new-score-section" class="hidden bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 mb-4">
        <p id="new-score-msg" class="text-sm sm:text-base font-bold text-amber-900 mb-3">
          🎉 Brawo! Twój wynik daje miejsce w Top 10!
        </p>
        <div class="flex flex-col sm:flex-row gap-2">
          <input
            id="player-name-input"
            type="text"
            maxlength="16"
            placeholder="Wpisz swoje imię..."
            class="flex-1 bg-white border border-amber-300 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500"
          />
          <button
            id="save-score-btn"
            type="button"
            class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition shadow-sm"
          >
            Zapisz
          </button>
        </div>
      </div>

      <!-- Lista Top 10 -->
      <div id="ranking-list-container" class="overflow-y-auto flex-1 space-y-2 pr-1 min-h-[220px]"></div>

      <!-- Stopka statusu synchronizacji -->
      <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
        <span id="ranking-sync-status"></span>
        <button id="ranking-close-btn" type="button" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-1.5 rounded-xl transition">
          Zamknij
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Zakończenia Quizu / Dobranoc (gdy wynik nie kwalifikuje się jeszcze do Top 10) -->
  <div id="goodnight-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 sm:p-8 flex flex-col border border-slate-100 text-center relative">
      <button id="goodnight-close-x" type="button" aria-label="Close" class="absolute top-5 right-5 w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center transition">
        ✕
      </button>
      <div class="text-5xl mb-3">🌙✨</div>
      <h3 id="goodnight-title" class="text-xl sm:text-2xl font-extrabold text-slate-800 mb-2">
        Pora spać! Dobra robota!
      </h3>
      <p id="goodnight-subtitle" class="text-slate-600 text-sm mb-5 leading-relaxed">
      </p>

      <!-- Karta punktów -->
      <div class="bg-indigo-50/80 border border-indigo-100 rounded-2xl p-4 mb-5 flex items-center justify-around">
        <div>
          <div id="goodnight-score-lbl" class="text-xs text-indigo-600 font-semibold uppercase tracking-wider">Twój wynik</div>
          <div id="goodnight-score-val" class="text-2xl sm:text-3xl font-extrabold text-indigo-700">0 pkt</div>
        </div>
        <div class="h-10 w-px bg-indigo-200"></div>
        <div>
          <div id="goodnight-top10-lbl" class="text-xs text-indigo-600 font-semibold uppercase tracking-wider">Próg Top 10</div>
          <div id="goodnight-top10-val" class="text-2xl sm:text-3xl font-extrabold text-slate-700">0 pkt</div>
        </div>
      </div>

      <!-- Akcje -->
      <div class="flex flex-col gap-2.5">
        <button
          id="goodnight-continue-btn"
          type="button"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-sm"
        >
          💪 Gram dalej (chcę do Top 10!)
        </button>
        <button
          id="goodnight-sleep-btn"
          type="button"
          class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 px-4 rounded-xl text-sm transition"
        >
          🌙 Idę spać (zakończ serię)
        </button>
        <button
          id="goodnight-view-ranking-btn"
          type="button"
          class="text-xs text-slate-500 hover:text-indigo-600 font-semibold py-1 transition"
        >
          🏆 Zobacz pełny ranking Top 10
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
