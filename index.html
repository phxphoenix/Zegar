<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nauka Zegara / Clock Learning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hand-transition {
      transition: transform 0.5s cubic-bezier(0.4, 2.08, 0.55, 0.44);
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }
    /* Zapobieganie przyklejaniu się obrysów focus/hover na urządzeniach mobilnych */
    .option-btn {
      -webkit-tap-highlight-color: transparent;
      outline: none !important;
    }
    @media (hover: hover) {
      .option-btn:hover {
        border-color: #6366f1;
        background-color: #eef2ff;
      }
    }
    .option-btn:focus-visible {
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans text-slate-800">

  <div class="bg-white rounded-3xl shadow-xl max-w-5xl w-full p-6 md:p-10 grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10 items-center">
    
    <!-- Lewa kolumna: Zegar SVG -->
    <div class="lg:col-span-6 flex flex-col items-center">
      <div class="flex flex-wrap items-center justify-between gap-2 w-full mb-3">
        <span id="score-badge" class="bg-indigo-100 text-indigo-700 font-bold px-4 py-1.5 rounded-full text-sm">
          🔥 Wynik: 0
        </span>
        <div class="flex flex-wrap gap-1.5 sm:gap-2">
          <button id="ranking-btn" onclick="openRankingModal(false)" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-semibold px-3 py-1.5 rounded-xl text-sm transition border border-amber-300">
            🏆 Ranking
          </button>
          <button id="lang-btn" onclick="toggleLang()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-3 py-1.5 rounded-xl text-sm transition">
            🌐 PL
          </button>
          <button id="toggle-panel-btn" onclick="togglePanel()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-xl text-sm transition border border-slate-200">
            ⚙️ Pokaż panel
          </button>
        </div>
      </div>

      <!-- Wskaźnik pory dnia nad zegarem -->
      <div class="w-full flex justify-center mb-2">
        <div id="day-period-badge" class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full font-bold text-sm sm:text-base shadow-sm border transition-all duration-300">
          <span id="day-period-icon">☀️</span>
          <span id="day-period-text">Rano</span>
        </div>
      </div>

      <!-- Tarcza zegara SVG -->
      <div class="relative w-72 h-72 sm:w-80 sm:h-80 lg:w-96 lg:h-96 xl:w-[420px] xl:h-[420px]">
        <svg id="clock-svg" viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
          <!-- Obudowa zegara -->
          <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#334155" stroke-width="6" />
          <circle cx="100" cy="100" r="88" fill="none" stroke="#e2e8f0" stroke-width="1" />
          
          <!-- Podziałki i cyfry wygenerowane przez JS -->
          <g id="clock-marks"></g>
          <g id="clock-numbers"></g>

          <!-- Wskazówka godzinowa (krótka, niebieska) -->
          <line id="hour-hand" x1="100" y1="100" x2="100" y2="52" stroke="#2563eb" stroke-width="6" stroke-linecap="round" class="hand-transition" transform="rotate(0 100 100)" />
          
          <!-- Wskazówka minutowa (długa, czerwona) -->
          <line id="minute-hand" x1="100" y1="100" x2="100" y2="28" stroke="#ef4444" stroke-width="4" stroke-linecap="round" class="hand-transition" transform="rotate(0 100 100)" />

          <!-- Środek zegara -->
          <circle cx="100" cy="100" r="5" fill="#1e293b" />
          <circle cx="100" cy="100" r="2" fill="#f8fafc" />
        </svg>
      </div>

      <div class="flex gap-4 mt-3 text-xs font-medium text-slate-500">
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-blue-600 inline-block"></span> <span id="lbl-hour-hand">Godzinowa</span></span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span> <span id="lbl-min-hand">Minutowa</span></span>
      </div>
    </div>

    <!-- Prawa kolumna: Panel sterowania i odpowiedzi -->
    <div class="lg:col-span-6 flex flex-col gap-5">
      
      <!-- Panel Rodzica / Nauczyciela (opcjonalny, domyślnie ukryty) -->
      <div id="teacher-panel" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-4 flex-col gap-4">
        <div class="flex items-center justify-between">
          <h2 id="panel-title" class="font-bold text-slate-700 text-sm uppercase tracking-wider">Ustaw czas zegara</h2>
          <button onclick="randomTime()" id="btn-random" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-3 py-1.5 rounded-lg transition">
            🎲 Losuj czas
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label id="lbl-hours" class="block text-xs font-semibold text-slate-500 mb-1">Godzina (0-23)</label>
            <input id="input-hour" type="number" min="0" max="23" value="9" class="w-full text-center text-xl font-bold bg-white border border-slate-300 rounded-xl py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div>
            <label id="lbl-minutes" class="block text-xs font-semibold text-slate-500 mb-1">Minuty (0-59)</label>
            <input id="input-minute" type="number" min="0" max="59" value="15" class="w-full text-center text-xl font-bold bg-white border border-slate-300 rounded-xl py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>

        <div class="flex flex-wrap gap-2 items-center justify-between pt-1">
          <select id="mode-select" onchange="generateQuestion()" class="bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none">
            <option value="digital">Cyfrowy (np. 15:30 / 09:15)</option>
            <option value="words">Słownie (np. wpół do czwartej)</option>
          </select>

          <div class="flex gap-2">
            <button onclick="applyManualTime(false)" id="btn-apply" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold px-4 py-2 rounded-xl transition">
              Ustaw
            </button>
            <button onclick="applyManualTime(true)" id="btn-apply-hide" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-xl transition">
              Ustaw i ukryj
            </button>
          </div>
        </div>
      </div>

      <!-- Sekcja pytań i 4 odpowiedzi -->
      <div>
        <h3 id="question-title" class="text-lg font-bold text-slate-800 mb-3 text-center lg:text-left">
          Która godzina jest na zegarze?
        </h3>
        <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        <div id="feedback-box" class="mt-4 min-h-[2.5rem] flex items-center justify-center lg:justify-start font-bold text-sm"></div>
      </div>

    </div>
  </div>

  <!-- Modal Rankingu Top 10 -->
  <div id="ranking-modal" onclick="handleModalBackdropClick(event)" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 sm:p-8 max-h-[90vh] flex flex-col border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h2 id="ranking-modal-title" class="text-xl sm:text-2xl font-extrabold text-slate-800 flex items-center gap-2">
          🏆 Ranking Top 10
        </h2>
        <button onclick="closeRankingModal()" aria-label="Close" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center transition">
          ✕
        </button>
      </div>

      <!-- Formularz wpisania imienia (widoczny tylko po zakwalifikowaniu do Top 10) -->
      <div id="new-score-section" class="hidden bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 mb-4">
        <p id="new-score-msg" class="text-sm sm:text-base font-bold text-amber-900 mb-3">
          🎉 Brawo! Twój wynik daje miejsce w Top 10!
        </p>
        <div class="flex flex-col sm:flex-row gap-2">
          <input
            id="player-name-input"
            type="text"
            maxlength="16"
            placeholder="Wpisz swoje imię..."
            class="flex-1 bg-white border border-amber-300 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500"
          />
          <button
            id="save-score-btn"
            onclick="submitTop10Score()"
            class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition shadow-sm"
          >
            Zapisz
          </button>
        </div>
      </div>

      <!-- Lista Top 10 -->
      <div id="ranking-list-container" class="overflow-y-auto flex-1 space-y-2 pr-1 min-h-[220px]"></div>

      <!-- Stopka statusu synchronizacji -->
      <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
        <span id="ranking-sync-status"></span>
        <button id="ranking-close-btn" onclick="closeRankingModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-1.5 rounded-xl transition">
          Zamknij
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // KONFIGURACJA FIREBASE REALTIME DATABASE
    // =========================================================================
    const FIREBASE_DB_URL = 'https://zegar-eda05-default-rtdb.europe-west1.firebasedatabase.app';

    const LOCAL_STORAGE_CACHE_KEY = 'zegar_leaderboard_top10_v1';
    const LOCAL_STORAGE_NAME_KEY = 'zegar_last_player_name_v1';

    const state = {
      h: 9,
      m: 15,
      lang: 'pl',
      panelVisible: false,
      score: 0,
      answered: false,
      options: [],
      correctAnswer: '',
      autoNextTimeout: null,
      leaderboard: [],
      pendingScore: null, // { score: number, mode: 'digital' | 'words' }
      lastSavedId: null,
      isSavingScore: false
    };

    const i18n = {
      pl: {
        score: '🔥 Wynik',
        rankingBtn: '🏆 Ranking',
        rankingTitle: '🏆 Ranking Top 10',
        newRecordMsg: (pts) => `🎉 Brawo! Wynik ${pts} pkt daje miejsce w Top 10! Wpisz imię:`,
        namePlaceholder: 'Wpisz swoje imię...',
        saveBtn: 'Zapisz',
        savingBtn: 'Zapisywanie...',
        closeBtn: 'Zamknij',
        emptyRanking: 'Brak zapisanych wyników. Rozwiąż zadania i bądź pierwszy!',
        loadingRanking: '⏳ Pobieranie rankingu...',
        ptsUnit: 'pkt',
        modeBadgeDigital: '🔢 Cyfrowy',
        modeBadgeWords: '💬 Słownie',
        syncCloudOk: '☁️ Wspólny ranking online (Firebase)',
        syncLocalFallback: '💾 Tryb lokalny (uzupełnij FIREBASE_DB_URL dla synchronizacji)',
        syncCloudError: '⚠️ Błąd połączenia z chmurą – wyświetlono kopię lokalną',
        defaultPlayerName: 'Gracz',
        hidePanel: '👁️ Ukryj panel',
        showPanel: '⚙️ Opcje / Panel',
        hourHand: 'Godzinowa (krótka)',
        minHand: 'Minutowa (długa)',
        panelTitle: 'Ustaw czas zegara',
        randomBtn: '🎲 Losuj czas',
        lblHours: 'Godzina (0-23)',
        lblMinutes: 'Minuty (0-59)',
        modeDigital: 'Cyfrowy (np. 15:30 / 09:15)',
        modeWords: 'Słownie (po polsku)',
        btnApply: 'Ustaw',
        btnApplyHide: 'Ustaw i ukryj',
        question: 'Która godzina jest na zegarze?',
        correct: '✅ Brawo! Za chwilę kolejne zadanie...',
        wrong: '❌ Błąd! Seria wyzerowana – spróbuj wskazać poprawną godzinę.',
        wrongWithScore: (pts) => `❌ Błąd! Koniec serii (twój wynik: ${pts} pkt). Spróbuj jeszcze raz!`,
        periods: {
          night: 'W nocy',
          morning: 'Rano',
          afternoon: 'Po południu',
          evening: 'Wieczorem'
        }
      },
      en: {
        score: '🔥 Score',
        rankingBtn: '🏆 Ranking',
        rankingTitle: '🏆 Top 10 Leaderboard',
        newRecordMsg: (pts) => `🎉 Awesome! ${pts} pts makes the Top 10! Enter your name:`,
        namePlaceholder: 'Enter your name...',
        saveBtn: 'Save',
        savingBtn: 'Saving...',
        closeBtn: 'Close',
        emptyRanking: 'No scores yet. Answer questions and be the first!',
        loadingRanking: '⏳ Loading leaderboard...',
        ptsUnit: 'pts',
        modeBadgeDigital: '🔢 Digital',
        modeBadgeWords: '💬 Words',
        syncCloudOk: '☁️ Shared online leaderboard (Firebase)',
        syncLocalFallback: '💾 Local mode (set FIREBASE_DB_URL for cloud sync)',
        syncCloudError: '⚠️ Cloud connection error – showing local backup',
        defaultPlayerName: 'Player',
        hidePanel: '👁️ Hide panel',
        showPanel: '⚙️ Options / Panel',
        hourHand: 'Hour hand (short)',
        minHand: 'Minute hand (long)',
        panelTitle: 'Set clock time',
        randomBtn: '🎲 Random time',
        lblHours: 'Hour (0-23)',
        lblMinutes: 'Minutes (0-59)',
        modeDigital: 'Digital (e.g. 15:30 / 09:15)',
        modeWords: 'In words (English)',
        btnApply: 'Set time',
        btnApplyHide: 'Set & Hide',
        question: 'What time is it on the clock?',
        correct: '✅ Great job! Next question coming up...',
        wrong: '❌ Wrong! Streak reset – try to find the right time.',
        wrongWithScore: (pts) => `❌ Wrong! Streak ended (your score: ${pts} pts). Try again!`,
        periods: {
          night: 'At night',
          morning: 'In the morning',
          afternoon: 'In the afternoon',
          evening: 'In the evening'
        }
      }
    };

    // =========================================================================
    // OBSŁUGA RANKINGU (FIREBASE REST API + LOCALSTORAGE FALLBACK)
    // =========================================================================
    function getFirebaseEndpoint() {
      const trimmed = (FIREBASE_DB_URL || '').trim().replace(/\/+$/, '');
      if (!trimmed) return null;
      return `${trimmed}/leaderboard.json`;
    }

    function loadLocalCache() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_CACHE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? sortLeaderboard(parsed) : [];
      } catch (e) {
        return [];
      }
    }

    function saveLocalCache(list) {
      try {
        localStorage.setItem(LOCAL_STORAGE_CACHE_KEY, JSON.stringify(list));
      } catch (e) {
        // Ignoruj błędy przepełnienia/prywatności localStorage
      }
    }

    // Sortowanie: wyższy wynik wyżej; przy remisie nowszy wynik wyżej (spychając najstarszy z tym samym wynikiem)
    function sortLeaderboard(list) {
      return (list || [])
        .filter(item => item && typeof item.score === 'number' && item.score > 0)
        .sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          const timeA = a.date ? new Date(a.date).getTime() : 0;
          const timeB = b.date ? new Date(b.date).getTime() : 0;
          return timeB - timeA;
        })
        .slice(0, 10);
    }

    function qualifiesForTop10(score, list) {
      if (!score || score <= 0) return false;
      const sorted = sortLeaderboard(list);
      if (sorted.length < 10) return true;
      return score >= sorted[sorted.length - 1].score;
    }

    async function fetchLeaderboard() {
      const endpoint = getFirebaseEndpoint();
      const dict = i18n[state.lang];
      const statusEl = document.getElementById('ranking-sync-status');

      if (!endpoint) {
        state.leaderboard = loadLocalCache();
        if (statusEl) statusEl.textContent = dict.syncLocalFallback;
        return state.leaderboard;
      }

      try {
        const res = await fetch(endpoint, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const rawList = Array.isArray(data) ? data : Object.values(data || {});
        const sorted = sortLeaderboard(rawList);
        state.leaderboard = sorted;
        saveLocalCache(sorted);
        if (statusEl) statusEl.textContent = dict.syncCloudOk;
        return sorted;
      } catch (err) {
        console.warn('Firebase fetch fallback to local cache:', err);
        state.leaderboard = loadLocalCache();
        if (statusEl) statusEl.textContent = dict.syncCloudError;
        return state.leaderboard;
      }
    }

    async function saveEntryToLeaderboard(newEntry) {
      const endpoint = getFirebaseEndpoint();
      const currentList = await fetchLeaderboard();
      const updated = sortLeaderboard([newEntry, ...currentList]);
      state.leaderboard = updated;
      saveLocalCache(updated);

      if (endpoint) {
        try {
          const res = await fetch(endpoint, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updated)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
        } catch (err) {
          console.error('Failed to save leaderboard to Firebase:', err);
        }
      }
      return updated;
    }

    function formatShortDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
    }

    function renderRankingList() {
      const container = document.getElementById('ranking-list-container');
      const dict = i18n[state.lang];
      container.innerHTML = '';

      if (!state.leaderboard || state.leaderboard.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'text-center py-10 text-slate-400 font-medium text-sm';
        emptyDiv.textContent = dict.emptyRanking;
        container.appendChild(emptyDiv);
        return;
      }

      const medals = ['🥇', '🥈', '🥉'];

      state.leaderboard.forEach((entry, idx) => {
        const isJustSaved = state.lastSavedId && entry.id === state.lastSavedId;
        const row = document.createElement('div');
        row.className = `flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-2xl border transition ${
          isJustSaved
            ? 'bg-amber-50 border-amber-400 ring-2 ring-amber-300'
            : idx < 3
            ? 'bg-slate-50 border-slate-200'
            : 'bg-white border-slate-100'
        }`;

        // Lewa strona: miejsce + imię + tryb + data
        const left = document.createElement('div');
        left.className = 'flex items-center gap-3 min-w-0';

        const posBadge = document.createElement('span');
        posBadge.className = 'w-7 text-center font-extrabold text-base shrink-0';
        posBadge.textContent = idx < 3 ? medals[idx] : `${idx + 1}.`;

        const infoCol = document.createElement('div');
        infoCol.className = 'min-w-0';

        const nameEl = document.createElement('div');
        nameEl.className = 'font-bold text-slate-800 text-sm sm:text-base truncate';
        nameEl.textContent = entry.name || dict.defaultPlayerName;

        const metaEl = document.createElement('div');
        metaEl.className = 'flex flex-wrap items-center gap-2 text-xs text-slate-500 mt-0.5';

        const modeSpan = document.createElement('span');
        modeSpan.className = 'bg-slate-200/70 text-slate-700 px-2 py-0.5 rounded-md font-semibold';
        modeSpan.textContent = entry.mode === 'words' ? dict.modeBadgeWords : dict.modeBadgeDigital;

        const dateSpan = document.createElement('span');
        dateSpan.textContent = formatShortDate(entry.date);

        metaEl.appendChild(modeSpan);
        if (dateSpan.textContent) metaEl.appendChild(dateSpan);

        infoCol.appendChild(nameEl);
        infoCol.appendChild(metaEl);

        left.appendChild(posBadge);
        left.appendChild(infoCol);

        // Prawa strona: punkty
        const scoreBadge = document.createElement('span');
        scoreBadge.className = 'bg-indigo-100 text-indigo-700 font-extrabold px-3 py-1 rounded-full text-sm shrink-0';
        scoreBadge.textContent = `${entry.score} ${dict.ptsUnit}`;

        row.appendChild(left);
        row.appendChild(scoreBadge);
        container.appendChild(row);
      });
    }

    async function openRankingModal(withNewScoreForm = false) {
      const modal = document.getElementById('ranking-modal');
      const formSection = document.getElementById('new-score-section');
      const nameInput = document.getElementById('player-name-input');
      const newScoreMsg = document.getElementById('new-score-msg');
      const container = document.getElementById('ranking-list-container');
      const dict = i18n[state.lang];

      modal.classList.remove('hidden');
      modal.classList.add('flex');

      if (withNewScoreForm && state.pendingScore) {
        formSection.classList.remove('hidden');
        newScoreMsg.textContent = dict.newRecordMsg(state.pendingScore.score);
        try {
          nameInput.value = localStorage.getItem(LOCAL_STORAGE_NAME_KEY) || '';
        } catch (e) {
          nameInput.value = '';
        }
        setTimeout(() => nameInput.focus(), 50);
      } else {
        formSection.classList.add('hidden');
      }

      container.innerHTML = `<div class="text-center py-10 text-slate-400 font-medium text-sm">${dict.loadingRanking}</div>`;
      await fetchLeaderboard();
      renderRankingList();
    }

    function closeRankingModal() {
      const modal = document.getElementById('ranking-modal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
      state.pendingScore = null;
    }

    function handleModalBackdropClick(e) {
      if (e.target.id === 'ranking-modal') {
        closeRankingModal();
      }
    }

    async function submitTop10Score() {
      if (!state.pendingScore || state.isSavingScore) return;
      const dict = i18n[state.lang];
      const nameInput = document.getElementById('player-name-input');
      const saveBtn = document.getElementById('save-score-btn');
      const rawName = (nameInput.value || '').trim();
      const playerName = rawName.slice(0, 16) || dict.defaultPlayerName;

      try {
        if (rawName) localStorage.setItem(LOCAL_STORAGE_NAME_KEY, playerName);
      } catch (e) {}

      state.isSavingScore = true;
      saveBtn.disabled = true;
      saveBtn.textContent = dict.savingBtn;

      const entryId = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
      const newEntry = {
        id: entryId,
        name: playerName,
        score: state.pendingScore.score,
        mode: state.pendingScore.mode,
        date: new Date().toISOString()
      };

      state.lastSavedId = entryId;
      await saveEntryToLeaderboard(newEntry);

      state.pendingScore = null;
      state.isSavingScore = false;
      saveBtn.disabled = false;
      saveBtn.textContent = dict.saveBtn;

      document.getElementById('new-score-section').classList.add('hidden');
      renderRankingList();
    }

    // Rysowanie podziałki i cyfr na tarczy
    function initClockFace() {
      const marksGroup = document.getElementById('clock-marks');
      const numbersGroup = document.getElementById('clock-numbers');

      for (let i = 0; i < 60; i++) {
        const angle = (i * 6) * (Math.PI / 180);
        const isHour = i % 5 === 0;
        const rOuter = 88;
        const rInner = isHour ? 78 : 83;

        const x1 = 100 + rInner * Math.sin(angle);
        const y1 = 100 - rInner * Math.cos(angle);
        const x2 = 100 + rOuter * Math.sin(angle);
        const y2 = 100 - rOuter * Math.cos(angle);

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('stroke', isHour ? '#1e293b' : '#94a3b8');
        line.setAttribute('stroke-width', isHour ? '2.5' : '1');
        line.setAttribute('stroke-linecap', 'round');
        marksGroup.appendChild(line);
      }

      for (let num = 1; num <= 12; num++) {
        const angle = (num * 30) * (Math.PI / 180);
        const rText = 64;
        const x = 100 + rText * Math.sin(angle);
        const y = 100 - rText * Math.cos(angle);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x);
        text.setAttribute('y', y);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('fill', '#0f172a');
        text.setAttribute('font-size', '14');
        text.setAttribute('font-weight', '700');
        text.textContent = num;
        numbersGroup.appendChild(text);
      }
    }

    // Ustalanie pory dnia na podstawie godziny (0-23)
    function getDayPeriodInfo(h) {
      if (h >= 5 && h < 12) {
        return { key: 'morning', icon: '🌅', colorClass: 'bg-amber-100 text-amber-800 border-amber-300' };
      } else if (h >= 12 && h < 18) {
        return { key: 'afternoon', icon: '☀️', colorClass: 'bg-sky-100 text-sky-800 border-sky-300' };
      } else if (h >= 18 && h < 22) {
        return { key: 'evening', icon: '🌆', colorClass: 'bg-orange-100 text-orange-800 border-orange-300' };
      } else {
        return { key: 'night', icon: '🌙', colorClass: 'bg-indigo-100 text-indigo-800 border-indigo-300' };
      }
    }

    function updateDayPeriodUI() {
      const periodInfo = getDayPeriodInfo(state.h);
      const dict = i18n[state.lang];
      const text = dict.periods[periodInfo.key];

      const badge = document.getElementById('day-period-badge');
      const iconSpan = document.getElementById('day-period-icon');
      const textSpan = document.getElementById('day-period-text');

      badge.className = `inline-flex items-center gap-2 px-4 py-1.5 rounded-full font-bold text-sm sm:text-base shadow-sm border transition-all duration-300 ${periodInfo.colorClass}`;
      iconSpan.textContent = periodInfo.icon;
      textSpan.textContent = text;
    }

    // Formatowanie cyfrowe - jednoznaczne z formatem 24h dostosowanym do pory dnia
    function formatDigital(h, m) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(h)}:${pad(m)}`;
    }

    // Formatowanie słowne PL / EN
    function formatWords(h, m, lang) {
      const h12 = h % 12 === 0 ? 12 : h % 12;
      const nextH = (h12 % 12) + 1;

      if (lang === 'en') {
        const nums = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
        if (m === 0) return `${nums[h12]} o'clock`;
        if (m === 15) return `quarter past ${nums[h12]}`;
        if (m === 30) return `half past ${nums[h12]}`;
        if (m === 45) return `quarter to ${nums[nextH]}`;
        if (m < 30) return `${m} past ${nums[h12]}`;
        return `${60 - m} to ${nums[nextH]}`;
      }

      const nom = ['', ' pierwsza', 'druga', 'trzecia', 'czwarta', 'piąta', 'szósta', 'siódma', 'ósma', 'dziewiąta', 'dziesiąta', 'jedenasta', 'dwunasta'].map(s => s.trim());
      const loc = ['', 'pierwszej', 'drugiej', 'trzeciej', 'czwartej', 'piątej', 'szóstej', 'siódmej', 'ósmej', 'dziewiątej', 'dziesiątej', 'jedenastej', 'dwunastej'];

      if (m === 0) return `pełna ${nom[h12]}`;
      if (m === 15) return `kwadrans po ${loc[h12]}`;
      if (m === 30) return `wpół do ${loc[nextH]}`;
      if (m === 45) return `za kwadrans ${nom[nextH]}`;
      if (m < 30) return `${m} min po ${loc[h12]}`;
      return `za ${60 - m} min ${nom[nextH]}`;
    }

    function formatOption(h, m) {
      const mode = document.getElementById('mode-select').value;
      const normH = ((h % 24) + 24) % 24;
      const normM = ((m % 60) + 60) % 60;
      return mode === 'digital' ? formatDigital(normH, normM) : formatWords(normH, normM, state.lang);
    }

    function updateClockHands() {
      const hourAngle = ((state.h % 12) * 30) + (state.m * 0.5);
      const minAngle = state.m * 6;
      document.getElementById('hour-hand').setAttribute('transform', `rotate(${hourAngle} 100 100)`);
      document.getElementById('minute-hand').setAttribute('transform', `rotate(${minAngle} 100 100)`);
    }

    function generateQuestion() {
      if (state.autoNextTimeout) {
        clearTimeout(state.autoNextTimeout);
        state.autoNextTimeout = null;
      }
      state.answered = false;
      document.getElementById('feedback-box').textContent = '';
      updateClockHands();
      updateDayPeriodUI();

      const correct = formatOption(state.h, state.m);
      state.correctAnswer = correct;

      const isPM = state.h >= 12;

      // Generowanie wiarygodnych zmyłek
      const candidates = [];

      // Przeciwny wariant 12h vs 24h (np. 15:15 vs 03:15)
      const oppositeH = (state.h + 12) % 24;
      candidates.push([oppositeH, state.m]);

      // Zamiana wskazówek
      let swappedH = Math.floor(state.m / 5) || 12;
      if (isPM && swappedH < 12) swappedH += 12;
      else if (!isPM && swappedH === 12) swappedH = 0;
      candidates.push([swappedH, (state.h % 12) * 5]);

      // Przesunięcia czasowe
      candidates.push([state.h, (state.m + 5) % 60]);
      candidates.push([state.h, (state.m + 55) % 60]);
      candidates.push([(state.h + 1) % 24, state.m]);
      candidates.push([(state.h + 23) % 24, state.m]);
      candidates.push([state.h, (60 - state.m) % 60]);
      candidates.push([(state.h + 1) % 24, (state.m + 15) % 60]);

      const set = new Set([correct]);
      for (const [ch, cm] of candidates) {
        if (set.size >= 4) break;
        set.add(formatOption(ch, cm));
      }

      while (set.size < 4) {
        let rh = Math.floor(Math.random() * 12);
        if (isPM) rh += 12;
        const rm = Math.floor(Math.random() * 12) * 5;
        set.add(formatOption(rh, rm));
      }

      state.options = Array.from(set).sort(() => Math.random() - 0.5);
      renderOptions();
    }

    function renderOptions() {
      // Usuwamy aktywny focus przed przebudową kontenera (kluczowe na urządzeniach dotykowych)
      if (document.activeElement && typeof document.activeElement.blur === 'function') {
        document.activeElement.blur();
      }

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      state.options.forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn w-full py-3.5 px-4 rounded-2xl border-2 border-slate-200 bg-white font-bold text-slate-700 transition text-center shadow-sm';
        btn.textContent = opt;
        btn.onclick = () => {
          btn.blur(); // natychmiastowe zdjęcie focusu po dotknięciu/kliknięciu
          checkAnswer(opt, btn);
        };
        container.appendChild(btn);
      });
    }

    async function checkAnswer(selected, btnElement) {
      const dict = i18n[state.lang];
      const feedback = document.getElementById('feedback-box');

      if (selected === state.correctAnswer) {
        if (!state.answered) {
          state.score++;
          state.answered = true;
        }

        // Zablokuj wszystkie przyciski i podświetl poprawny
        const allBtns = document.querySelectorAll('#options-container button');
        allBtns.forEach(btn => btn.disabled = true);

        btnElement.className = 'option-btn w-full py-3.5 px-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 font-bold text-emerald-700 transition text-center shadow-sm';
        feedback.className = 'mt-4 min-h-[2.5rem] flex items-center justify-center lg:justify-start font-bold text-sm text-emerald-600 animate-pulse';
        feedback.textContent = dict.correct;
        updateLabels();

        // Automatyczne przejście do kolejnego wariantu po krótkiej pauzie (1.2s)
        if (state.autoNextTimeout) clearTimeout(state.autoNextTimeout);
        state.autoNextTimeout = setTimeout(() => {
          randomTime();
        }, 1200);
      } else {
        // Błędna odpowiedź - przeliczamy wynik przy pierwszym błędzie
        const achievedScore = !state.answered ? state.score : 0;
        const currentMode = document.getElementById('mode-select').value;

        state.answered = true;
        state.score = 0;

        btnElement.className = 'option-btn w-full py-3.5 px-4 rounded-2xl border-2 border-rose-400 bg-rose-50 font-bold text-rose-700 transition text-center shadow-sm';
        feedback.className = 'mt-4 min-h-[2.5rem] flex items-center justify-center lg:justify-start font-bold text-sm text-rose-600';
        feedback.textContent = achievedScore > 0 ? dict.wrongWithScore(achievedScore) : dict.wrong;
        updateLabels();

        // Sprawdzenie, czy wynik kwalifikuje się do Top 10
        if (achievedScore > 0) {
          const latestList = await fetchLeaderboard();
          if (qualifiesForTop10(achievedScore, latestList)) {
            state.pendingScore = {
              score: achievedScore,
              mode: currentMode
            };
            openRankingModal(true);
          }
        }
      }
    }

    function applyManualTime(hideAfter) {
      const hVal = parseInt(document.getElementById('input-hour').value, 10);
      const mVal = parseInt(document.getElementById('input-minute').value, 10);
      state.h = isNaN(hVal) ? 0 : Math.min(23, Math.max(0, hVal));
      state.m = isNaN(mVal) ? 0 : Math.min(59, Math.max(0, mVal));
      document.getElementById('input-hour').value = state.h;
      document.getElementById('input-minute').value = state.m;

      // Ręczne ustawienie czasu resetuje serię punktową
      state.score = 0;
      updateLabels();

      if (hideAfter && state.panelVisible) {
        togglePanel();
      }
      generateQuestion();
    }

    function randomTime() {
      state.h = Math.floor(Math.random() * 24);
      state.m = Math.floor(Math.random() * 12) * 5; // Losowanie co 5 minut dla czytelności
      document.getElementById('input-hour').value = state.h;
      document.getElementById('input-minute').value = state.m;
      generateQuestion();
    }

    function togglePanel() {
      state.panelVisible = !state.panelVisible;
      const panel = document.getElementById('teacher-panel');
      if (state.panelVisible) {
        panel.classList.remove('hidden');
        panel.classList.add('flex');
      } else {
        panel.classList.remove('flex');
        panel.classList.add('hidden');
      }
      updateLabels();
    }

    function toggleLang() {
      state.lang = state.lang === 'pl' ? 'en' : 'pl';
      updateLabels();
      generateQuestion();
      if (!document.getElementById('ranking-modal').classList.contains('hidden')) {
        renderRankingList();
      }
    }

    function updateLabels() {
      const dict = i18n[state.lang];
      document.getElementById('score-badge').textContent = `${dict.score}: ${state.score}`;
      document.getElementById('ranking-btn').textContent = dict.rankingBtn;
      document.getElementById('ranking-modal-title').textContent = dict.rankingTitle;
      document.getElementById('player-name-input').placeholder = dict.namePlaceholder;
      document.getElementById('save-score-btn').textContent = state.isSavingScore ? dict.savingBtn : dict.saveBtn;
      document.getElementById('ranking-close-btn').textContent = dict.closeBtn;
      if (state.pendingScore) {
        document.getElementById('new-score-msg').textContent = dict.newRecordMsg(state.pendingScore.score);
      }

      document.getElementById('lang-btn').textContent = `🌐 ${state.lang.toUpperCase()}`;
      const toggleBtn = document.getElementById('toggle-panel-btn');
      toggleBtn.textContent = state.panelVisible ? dict.hidePanel : dict.showPanel;
      toggleBtn.className = state.panelVisible 
        ? "bg-amber-100 hover:bg-amber-200 text-amber-800 font-semibold px-3 py-1.5 rounded-xl text-sm transition"
        : "bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-xl text-sm transition border border-slate-200";

      document.getElementById('lbl-hour-hand').textContent = dict.hourHand;
      document.getElementById('lbl-min-hand').textContent = dict.minHand;
      document.getElementById('panel-title').textContent = dict.panelTitle;
      document.getElementById('btn-random').textContent = dict.randomBtn;
      document.getElementById('lbl-hours').textContent = dict.lblHours;
      document.getElementById('lbl-minutes').textContent = dict.lblMinutes;
      document.getElementById('mode-select').options[0].textContent = dict.modeDigital;
      document.getElementById('mode-select').options[1].textContent = dict.modeWords;
      document.getElementById('btn-apply').textContent = dict.btnApply;
      document.getElementById('btn-apply-hide').textContent = dict.btnApplyHide;
      document.getElementById('question-title').textContent = dict.question;
      updateDayPeriodUI();
    }

    // Obsługa klawisza Enter w polach godziny/minut
    ['input-hour', 'input-minute'].forEach(id => {
      const inp = document.getElementById(id);
      if (inp) {
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') applyManualTime(false);
        });
      }
    });

    // Obsługa klawiszy Enter i Escape w modalu rankingu
    document.getElementById('player-name-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitTop10Score();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('ranking-modal').classList.contains('hidden')) {
        closeRankingModal();
      }
    });

    initClockFace();
    updateLabels();
    randomTime();
    fetchLeaderboard();
  </script>
</body>
</html>
